<script type="text/html" data-help-name="fap-ldp-shacl-serve">
  <p>ext/shacl serve node (E5, app-shape-editor rev 4 §3.3). Serves, on the routes reserved by the
  core patch (A.2):</p>
  <ul>
    <li><code>GET /shapes</code> — SHACL contract of the core model (model.json), Turtle + ETag</li>
    <li><code>GET /shapes/</code> — index of all sources (core + packages, states) (F3.6)</li>
    <li><code>GET /fragment</code> — core model.json + hash (F3.5)</li>
    <li><code>GET /apps/&lt;slug&gt;/shapes</code> — package contract, published tables only (F3.2/F3.3)</li>
    <li><code>GET /apps/&lt;slug&gt;/fragment</code> — raw fragment + fragment_hash + supersedes (F3.5)</li>
  </ul>
  <p>Read = any authenticated pod user. No write endpoint here: the SQL write path is the only
  write authority. Validation endpoints (POST …/validate) land in J3.</p>
</script>
