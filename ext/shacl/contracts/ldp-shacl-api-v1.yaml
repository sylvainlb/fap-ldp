# ldp-shacl-api v1.3 — routes served by ext/shacl, reserved in the core by the A.2 route patch
# (spec app-shape-editor.md rev 4). Read-only publication of compiled SHACL contracts + fragment
# views; the write path is untouched (SQL-only). v1.1 added the J3 validation endpoints;
# v1.3 adds (additive) the object registry: tables[] in the index + per-object shapes.
apiVersion: fap.facis/contracts/v1
kind: ExtContracts
metadata:
  name: ldp-shacl-api
  version: "1.3"
spec:
  routes:
    - method: GET
      path: /shapes
      summary: "SHACL contract of the core model (model.json). Content negotiation: JSON-LD (application/ld+json) by default — workstream 3 (app-ui-editor) fetches with res.json(); Turtle when Accept: text/turtle. JSON-LD form: inline sh:property objects, rdfs:label/sh:name as locale maps, sh:in as string array, sh:targetClass/sh:class as ns# class IRIs. ETag W/\"<sha256 of canonical Turtle>\", If-None-Match → 304. Auth: any authenticated pod user."
    - method: GET
      path: /shapes/
      summary: "Index of sources (core + packages, all states): { sources: [ { kind, slug, version, state, contract (URL), package, contractUri, fragmentUri, fragmentHash, supersedes, published, tables: [ { table, phys, label (locale map), published, count, fields[] } ] } ] }. tables[] = object registry (workstream 3 rev 8): ALL tables of the model, published or not, with the flag; revoked packages get tables: []. JSON-LD."
    - method: GET
      path: /shapes/<table>
      summary: "Single object shape of the CORE model: the NodeShape as JSON-LD with reg:published embedded (reg = <base>/ns/reg#). 404 unknown table. Workstream 3 rev 8 — 1 shape = 1 JSON = 1 object type."
    - method: GET
      path: /fragment
      summary: "Core model.json (source of truth, read-only) + fragmentHash."
    - method: GET
      path: /apps/<slug>/shapes
      summary: "SHACL contract of a package, published tables only (dsp.asset_mapping). 404 unknown slug / no published table, 410 revoked. ETag as /shapes. The compiled graph @id is the package contract IRI (/apps/<slug>/shapes)."
    - method: GET
      path: /apps/<slug>/shapes/<table>
      summary: "Single object shape of a package: NodeShape as JSON-LD with reg:published embedded. 404 unknown table / no such package, 410 revoked. Workstream 3 rev 8."
    - method: GET
      path: /apps/<slug>/fragment
      summary: "Raw model_fragment + fragment_hash + state + supersedes. 404 unknown, 410 revoked."
    - method: POST
      path: /apps/<slug>/validate
      summary: "J3 (F4.1): validate an RDF/JSON-LD data graph against the package contract. Body = RDF (application/ld+json). Response 200 = W3C SHACL ValidationReport (JSON-LD), sh:conforms + sh:result[]. When the fragment has a FK toward users, the core contract is loaded too. Read-only: no write, no authority on the internal path."
    - method: POST
      path: /apps/<slug>/<table>/validate
      summary: "Same, restricted to one table's shape (404 if the table is not published in the package)."
  invariants:
    - "Contracts are compiled lazily from the stored fragment/model.json, cached by fragment hash; never editable (F3.1)."
    - "IRIs computed on the physical PG table name (R1.2); never sh:closed (F2.5)."
    - "Package revoked → contract gone (410) and cache dropped on pg_notify fap_revoked (C2)."
    - "No write endpoint in this ext; no core or E11 behavior modified (C5)."
