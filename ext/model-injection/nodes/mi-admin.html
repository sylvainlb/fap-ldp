<script type="text/html" data-help-name="fap-ldp-mi-admin">
  <p>Extension <b>model-injection (E11)</b> — endpoints admin du contrat d'injection
  (spec <code>model-injection-spec.md</code> v0.3 §3) :</p>
  <ul>
    <li><code>POST /admin/apps</code> → install gouverné d'un package (une transaction : validation annexe A,
      quotas, accord de contribution <code>dsp.contracts</code>, DDL <code>app.store_&lt;slug&gt;_*</code>,
      <code>dsp.asset_mapping</code>, ACL initiales, audit) → <code>201</code> + <code>Location: /apps/&lt;slug&gt;/meta</code></li>
    <li><code>DELETE /admin/apps/&lt;slug&gt;</code> → révocation (contrat révoqué, asset dépublié, purge cache PDP)</li>
    <li><code>GET /apps/</code> et <code>GET /apps/&lt;slug&gt;/meta</code> → lecture, tout utilisateur authentifié</li>
  </ul>
  <p>v1 : écriture = rôle <b>admin</b> seul. Erreurs JSON-LD <code>dspace:Error</code>
  (<code>schema_violation</code>, <code>invalid_identifier</code>, <code>blacklisted_effect</code>,
  <code>quota_exceeded</code>, <code>prefix_collision</code>). Connexion PG en rôle <b>admin</b> (DDL = migration).</p>
</script>
