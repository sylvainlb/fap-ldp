<script type="text/html" data-help-name="fap-ldp-mi-admin">
  <p><b>model-injection (E11)</b> extension — admin endpoints of the injection contract
  (spec <code>model-injection-spec.md</code> v0.3 §3):</p>
  <ul>
    <li><code>POST /admin/apps</code> → governed package install (one transaction: annex A validation,
      quotas, contribution agreement <code>dsp.contracts</code>, DDL <code>app.store_&lt;slug&gt;_*</code>,
      <code>dsp.asset_mapping</code>, initial ACLs, audit) → <code>201</code> + <code>Location: /apps/&lt;slug&gt;/meta</code></li>
    <li><code>DELETE /admin/apps/&lt;slug&gt;</code> → revocation (contract revoked, asset unpublished, PDP cache purge)</li>
    <li><code>GET /apps/</code> and <code>GET /apps/&lt;slug&gt;/meta</code> → read, any authenticated user</li>
  </ul>
  <p>v1: writes = <b>admin</b> role only. JSON-LD <code>dspace:Error</code> errors
  (<code>schema_violation</code>, <code>invalid_identifier</code>, <code>blacklisted_effect</code>,
  <code>quota_exceeded</code>, <code>prefix_collision</code>). PG connection as the <b>admin</b> role (DDL = migration).</p>
