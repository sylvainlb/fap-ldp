<script type="text/html" data-help-name="fap-ldp-pdp">
  <p>Nœud PDP (Policy Decision Point) FAP-LDP — spec fap-ldp v0.2 §7.1.</p>
  <p>Pipeline : étape 1 contrat/capacité DSP (cache TTL PT1H, purge immédiate sur
  <code>pg_notify('fap_revoked')</code>, contrat-cadre interne si claim <code>org</code> = pod) →
  étape 2 ACL (<code>auth.can</code> en PG avec <code>SET LOCAL app.webid/role/base_iri</code>) →
  étape 3 obligations ODRL (<code>facis:resourceId isAnyOf</code>) + audit <code>dsp.audit</code>.</p>
  <p>Appelé par le nœud conteneur LDP via <code>pdpNode.decide({token, claims, resourceUri, containerPath, mode, published})</code>.</p>
