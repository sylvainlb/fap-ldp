<script type="text/html" data-help-name="fap-ldp-pdp">
  <p>FAP-LDP PDP node (Policy Decision Point) — spec fap-ldp v0.2 §7.1.</p>
  <p>Pipeline: step 1 DSP contract/capacity (TTL PT1H cache, immediate purge on
  <code>pg_notify('fap_revoked')</code>, internal framework contract if claim <code>org</code> = pod) →
  step 2 ACL (<code>auth.can</code> in PG with <code>SET LOCAL app.webid/role/base_iri</code>) →
  step 3 ODRL obligations (<code>facis:resourceId isAnyOf</code>) + audit <code>dsp.audit</code>.</p>
