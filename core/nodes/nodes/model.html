<script type="text/javascript">

  color: '#D8BFD8',

  outputs: 0

<script type="text/html" data-template-name="fap-ldp-model">
  <div class="form-row"><label>Nom</label><input type="text" id="node-input-name"></div>

<script type="text/html" data-help-name="fap-ldp-model">
  <p>Nœud de boot <b>fap-ldp-model</b> : applique <code>config/model.json</code> du déploiement
  (tables <code>app.&lt;table&gt;</code>, triggers, RLS, mapping <code>dsp.asset_mapping</code>).
  Connexion en rôle <b>admin</b> (boot = migration) ; le runtime LDP utilise les rôles
  <code>app</code>/<code>reader</code>. Exemple de modèle : <code>examples/supervision/model.json</code>.</p>
</script>
