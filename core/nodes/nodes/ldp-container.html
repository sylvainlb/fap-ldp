<script type="text/html" data-help-name="fap-ldp-container">
  <p>FAP-LDP LDP container node (PEP) — spec fap-ldp v0.2 §6. LDP/JSON-LD endpoint served by ORCE
  (behind caddy on 443): GET/POST/PUT/DELETE/PATCH on resources and BasicContainers,
  <code>GET/PUT &lt;res&gt;.acl</code> (WebACL ⇄ <code>auth.acl</code>), ETag + If-Match/If-None-Match
  (304/412), PATCH = JSON Merge Patch (RFC 7386), JSON-LD errors <code>dspace:Error</code>.</p>
  <p>Non-LDP paths (<code>/dsp/*</code>, <code>/red*</code>, <code>/editor*</code>) are left
  to the FAP core. Container↔table mapping via <code>dsp.asset_mapping</code>; access control delegated
  to the PDP node (DSP contract + ACL, RLS in PG).</p>
</script>
