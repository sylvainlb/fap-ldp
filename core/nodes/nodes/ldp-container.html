<script type="text/html" data-help-name="fap-ldp-container">
  <p>Nœud conteneur LDP (PEP) FAP-LDP — spec fap-ldp v0.2 §6. Endpoint LDP/JSON-LD servi par ORCE
  (derrière caddy en 443) : GET/POST/PUT/DELETE/PATCH sur ressources et BasicContainers,
  <code>GET/PUT &lt;res&gt;.acl</code> (WebACL ⇄ <code>auth.acl</code>), ETag + If-Match/If-None-Match
  (304/412), PATCH = JSON Merge Patch (RFC 7386), erreurs JSON-LD <code>dspace:Error</code>.</p>
  <p>Chemins hors LDP (<code>/dsp/*</code>, <code>/red*</code>, <code>/editor*</code>) sont laissés
  au cœur FAP. Mapping conteneur↔table via <code>dsp.asset_mapping</code> ; contrôle d'accès délégué
  au nœud PDP (contrat DSP + ACL, RLS en PG).</p>
</script>
